# glob 9.0.0-14.0.1 (medium): an aborted walk keeps traversing in the background.
# Fixed in 14.0.2, but no consumer here can take it (re-checked 2026-11-17):
#   - glob 10.5.0 (production install): api > sequelize-cli 6.6.5 pins
#     js-beautify 1.15.4 exactly, which wants glob ^10.4.2. sequelize-cli 6.6.5
#     is the latest release, and even js-beautify 2.0.3 is on glob ^13.0.6.
#   - glob 10.5.0 (dev): license-checker-rseidelsohn 4.4.2 >
#     read-installed-packages > read-package-json 6.0.4 (deprecated; 7.0.1 is
#     still on glob ^10.2.2).
#   - glob 13.0.6 (dev): @afixt/usecase-runner 1.0.1 (1.2.0 moves to ^14.0.3,
#     but the other two paths keep the advisory open either way).
# Exploiting it needs a caller passing an AbortSignal; none of these does, and
# all of them glob repo-authored paths from the CLI. Forcing glob 14 across those
# ranges is a major the dependents have not adopted.
reason = "Needs an AbortSignal caller, none here; sequelize-cli (latest) pins js-beautify on glob 10 and read-package-json is deprecated on glob 10. Re-checked 2026-11-17."

