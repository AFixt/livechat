# the latest releases of several consumers still reject 11.x (re-checked
# 2026-11-17):
#   - minimatch 10.2.5 (dev): eslint-plugin-sonarjs (4.2.2 latest, ^10.2.6) and
#     markdownlint-cli (0.50.0 latest, ~10.2.6), plus
#     @typescript-eslint/typescript-estree 8.59.0, eslint-plugin-import-x 4.16.2
#     and glob 13.0.6, whose newer releases do accept 11.x.
#   - minimatch 9.0.9 (production install): api > sequelize-cli 6.6.5 >
#     js-beautify 1.15.4 (exact pin) > editorconfig 1.0.7 and glob 10.5.0;
#     also read-package-json's glob 10.5.0 (dev).
# A forced override is not safe: minimatch 11 removes makeRe(), which
