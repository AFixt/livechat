# extract-zip 2.0.1 (CVSS 8.6). No fixed version exists — 2.0.1 is still the
# latest published release, and osv reports the advisory as `last_affected:
# 2.0.1` with no `fixed` event (re-checked 2026-11-17). Dev-only: ui >
# @size-limit/preset-app > @size-limit/time > estimo, whose puppeteer-core
# 24.22.0 and find-chrome-bin 2.0.4 both pin @puppeteer/browsers 2.10.10
# exactly. estimo 3.0.5 and find-chrome-bin 2.0.4 are both still the latest
# releases, and @puppeteer/browsers 2.13.2 (the newest 2.x) still depends on
# extract-zip ^2.0.1. Only @puppeteer/browsers 3.x drops it, and forcing a
# major onto two exact pins is not a safe override. Never in the production
# api/ui/widget runtime. Tracked in #51. Revisit at ignoreUntil: adopt a fixed
# extract-zip, or an estimo that moves to @puppeteer/browsers 3.x.
reason = "No fixed version published (2.0.1 is latest, re-checked 2026-11-17); dev-only via estimo, whose deps pin @puppeteer/browsers 2.10.10 exactly. Tracked in #51."

