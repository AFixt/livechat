# Security exception registry — the single catalogue of every accepted
# suppression / allow-list entry across the repo's security-baseline tooling.
#
# WHY THIS FILE EXISTS
#   Suppressions were previously scattered across scripts/semgrep.sh,
#   scripts/npm-audit.sh, osv-scanner.toml, .dependency-check-suppressions.xml,
#   and (as sibling PRs land) .trivyignore / checkov skips / a secret-scan
#   baseline. Nothing tied them to an OWNER, an EXPIRY, or a review cadence, so
#   a "temporary" exception could live forever unnoticed. This registry gives
#   every one of them a lifecycle.
#
# THIS FILE DOES NOT SUPPRESS ANYTHING. The suppression still lives in the tool
#   config it belongs to (that is where each tool reads it). This registry
#   CATALOGUES those suppressions and adds the missing governance metadata.
#   Do not delete a suppression from its tool config just because it is listed
#   here.
#
# LIFECYCLE (see docs/security/README.md for the full process)
#   - Adding one: add it to the tool's own config with an inline reason, THEN
#     add an entry here with owner + reason + added + expires.
#   - Reviewing: `npm run security:exceptions` (scripts/check-exceptions.sh)
#     fails the gate on any active entry whose `expires` is in the past, and
#     warns on any expiring within the next 30 days.
#   - Expiring: on the review date, either remove the suppression (fix the
#     finding) or renew the entry with a fresh justification + expiry.
#
# FIELDS (per entry)
#   id       stable slug, unique in this file.
#   tool     which scanner the suppression belongs to.
#   source   the file where the actual suppression lives.
#   rule(s)  the rule id(s) / advisory id(s) being suppressed.
#   owner    who is accountable for reviewing it (GitHub handle or team).
#   reason   why it is accepted (short; the full rationale stays inline in
#            `source`).
#   added    ISO date the exception was first accepted / catalogued.
#   expires  ISO date it must be re-justified or removed. The gate warns while
#            this date is within EXCEPTION_WARN_DAYS and goes red once it has
#            passed — that is the point.
#   status   active | pending | none. Only `active` entries are gated.
#   issue    related GitHub issue, if any.

version: 1

# NOTE ON OWNERS: `@AFixt/security` is the accountable team placeholder.
# Replace with the specific GitHub handle that owns each item as ownership is
# assigned; the review process in docs/security/README.md drives that.

exceptions:
  # --- semgrep (scripts/semgrep.sh --exclude-rule) ------------------------
  - id: semgrep-node-timing-attack
    tool: semgrep
    source: scripts/semgrep.sh
    rules:
      - ajinabraham.njsscan.crypto.timing_attack_node.node_timing_attack
    owner: "@AFixt/security"
    reason: >-
      False positive. Every hit is a `token === undefined` / `=== null`
      presence check, not a comparison of secret material.
    added: 2026-08-15
    expires: 2027-02-15
    status: active
    issue: 65

  - id: semgrep-node-nosqli
    tool: semgrep
    source: scripts/semgrep.sh
    rules:
      - ajinabraham.njsscan.database.nosql_find_injection.node_nosqli_injection
    owner: "@AFixt/security"
    reason: >-
      False positive. Hits are Sequelize `where` clauses over Zod-validated
      scalars; the rule targets raw MongoDB query objects.
    added: 2026-08-15
    expires: 2027-02-15
    status: active
    issue: 65

  - id: semgrep-njsscan-good-helmet
    tool: semgrep
    source: scripts/semgrep.sh
    rules:
      - ajinabraham.njsscan.good.good_helmet_checks.helmet_header_x_powered_by
      - ajinabraham.njsscan.good.good_helmet_checks.helmet_header_dns_prefetch
      - ajinabraham.njsscan.good.good_helmet_checks.helmet_header_hsts
      - ajinabraham.njsscan.good.good_helmet_checks.helmet_header_ienoopen
      - ajinabraham.njsscan.good.good_helmet_checks.helmet_header_nosniff
      - ajinabraham.njsscan.good.good_helmet_checks.helmet_header_xss_filter
    owner: "@AFixt/security"
    reason: >-
      Not findings. The njsscan `good` namespace matches CORRECT usage — these
      fire because api/src/app.ts configures helmet properly.
    added: 2026-08-15
    expires: 2027-02-15
    status: active
    issue: 65

  - id: semgrep-nginx-header-redefinition
    tool: semgrep
    source: scripts/semgrep.sh
    rules:
      - generic.nginx.security.header-redefinition.header-redefinition
    owner: "@AFixt/security"
    reason: >-
      Was real, now fixed. ui/nginx.conf and widget/nginx.conf now repeat the
      server-block headers inside location blocks; the rule cannot see that.
    added: 2026-08-15
    expires: 2027-02-15
    status: active
    issue: 65

  - id: semgrep-gha-mutable-action-tag
    tool: semgrep
    source: scripts/semgrep.sh
    rules:
      - yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
    owner: "@AFixt/security"
    reason: >-
      Accepted by decision (ADR-0010): keep mutable major tags so upstream
      security fixes flow, since Dependabot is disabled by choice.
    added: 2026-08-15
    expires: 2027-08-15
    status: active
    issue: 65

  - id: semgrep-sequelize-tls
    tool: semgrep
    source: scripts/semgrep.sh
    rules:
      - ajinabraham.njsscan.database.sequelize_tls.sequelize_tls
    owner: "@AFixt/security"
    reason: >-
      TLS on the DB connection is implemented but env-driven (DB_SSL/DB_SSL_CA)
      so it can stay off for local docker-compose; production sets DB_SSL=true.
      The rule matches the whole construction and cannot see the runtime env.
    added: 2026-08-15
    expires: 2027-02-15
    status: active
    issue: 65

  # --- dependency advisories (scripts/npm-audit.sh + osv-scanner.toml) ----
  - id: dep-extract-zip-symlink-traversal
    tool: npm-audit, osv-scanner
    source: scripts/npm-audit.sh (ALLOW) + osv-scanner.toml (IgnoredVulns)
    rules:
      - GHSA-jmr9-qjv8-65gv
    owner: "@AFixt/security"
    reason: >-
      extract-zip 2.0.1 unvalidated symlink path traversal. No fixed version
      exists (2.0.1 is latest). Dev-only: transitive via @puppeteer/browsers in
      the Lighthouse/estimo perf tooling, never in the production runtime.
    added: 2026-08-15
    # Aligned with osv-scanner.toml `ignoreUntil = 2026-11-13`.
    expires: 2026-11-13
    status: active
    issue: 51

  # --- container / Dockerfile / IaC scanning (ADR-0011, issue #60) --------
  # The nginx-image non-root deferral is one decision expressed in three tool
  # configs (Hadolint DL3002, Trivy AVD-DS-0002, Checkov CKV_DOCKER_3); each is
  # catalogued separately so removing the suppression from any one config is a
  # tracked action.
  - id: hadolint-nginx-root
    tool: hadolint
    source: .hadolint.yaml (ignored)
    rules:
      - DL3002
    owner: "@AFixt/security"
    reason: >-
      ui/ and widget/ are nginx images that bind privileged port 80 to serve
      static assets; running unprivileged needs the nginx-unprivileged base +
      nginx.conf changes owned by a separate workstream. api/ already USER node.
    added: 2026-08-16
    expires: 2027-02-16
    status: active
    issue: 60

  - id: hadolint-apk-nopin
    tool: hadolint
    source: .hadolint.yaml (ignored)
    rules:
      - DL3018
    owner: "@AFixt/security"
    reason: >-
      `apk add --no-cache brotli` in ui/Dockerfile. Alpine package versions track
      the base image's repo snapshot, so a hard pin breaks on the next base bump
      for no security gain; --no-cache already avoids a stale index.
    added: 2026-08-16
    expires: 2027-02-16
    status: active
    issue: 60

  - id: trivy-nginx-root
    tool: trivy
    source: .trivyignore (exp:2027-02-16)
    rules:
      - AVD-DS-0002
    owner: "@AFixt/security"
    reason: >-
      Same nginx-root deferral as hadolint-nginx-root, expressed for Trivy's
      `config` misconfig scan of the ui/ and widget/ Dockerfiles.
    added: 2026-08-16
    expires: 2027-02-16
    status: active
    issue: 60

  - id: checkov-nginx-root
    tool: checkov
    source: .checkov.yaml (skip-check)
    rules:
      - CKV_DOCKER_3
    owner: "@AFixt/security"
    reason: >-
      Same nginx-root deferral as hadolint-nginx-root, expressed for Checkov's
      Dockerfile framework. Checkov skip-check has no native expiry; this entry
      is the lifecycle.
    added: 2026-08-16
    expires: 2027-02-16
    status: active
    issue: 60

  - id: kics-compose-dev-secrets
    tool: kics
    source: scripts/kics.sh (--exclude-queries)
    rules:
      - a88baa34-e2ad-44ea-ad6f-8cac87bc7c71 # Passwords And Secrets
    owner: "@AFixt/security"
    reason: >-
      The only hits are the dev-only placeholder secrets in docker-compose.yml
      (`dev-*-change-me`) that run the LOCAL stack; prod injects real values at
      runtime. Authoritative secret detection is trufflehog's job (ADR-0008).
    added: 2026-08-16
    expires: 2027-02-16
    status: active
    issue: 60

# --- catalogued but not currently suppressing anything --------------------
# Kept so the registry is the exhaustive index; the check script ignores
# non-active entries.
inactive:
  - id: owasp-dependency-check-suppressions
    tool: owasp-dependency-check
    source: .dependency-check-suppressions.xml
    rules: []
    owner: "@AFixt/security"
    reason: >-
      Suppression file exists but currently holds NO active suppressions (only
      a template comment). Any future entry must also be recorded above.
    added: 2026-08-15
    status: none
    issue: 65

  - id: trufflehog-verified-only
    tool: trufflehog
    source: package.json (security:secrets, --results=verified)
    rules: []
    owner: "@AFixt/security"
    reason: >-
      Posture, not a suppression baseline: the secret scan only fails on
      VERIFIED secrets. There is no allow-listed/baselined secret. If a
      baseline file is ever introduced, catalogue each entry above.
    added: 2026-08-15
    status: none
    issue: 65

# --- pending: owned by sibling security-baseline PRs (#82-84) -------------
# When their PRs land and introduce suppressions (a ZAP ignore list), move each
# into `exceptions:` above with owner + expiry. This registry is the agreed home
# for them. (The trivy/checkov container-scan suppressions landed with #60 and
# are catalogued as active entries above.)
pending:
  - id: zap-ignore
    tool: owasp-zap
    source: .zap/ ignore rules (owned by the ZAP PR)
    owner: "@AFixt/security"
    reason: "Reserved — populate when the ZAP baseline PR lands (#82-84)."
    status: pending
