    tool: trivy
    source: .trivyignore (not yet added)
    owner: "@AFixt/security"
    reason: "Reserved — populate when the trivy PR lands (#82-84)."
    status: pending
  - id: checkov-skips
    tool: checkov
    source: inline `# checkov:skip=...` comments (not yet added)
    owner: "@AFixt/security"
    reason: "Reserved — populate when the checkov PR lands (#82-84)."
    status: pending
  - id: zap-ignore
    tool: owasp-zap
    source: .zap/ ignore rules (owned by the ZAP PR)
    owner: "@AFixt/security"
    reason: "Reserved — populate when the ZAP baseline PR lands (#82-84)."
    status: pending
