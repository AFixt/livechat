# Hadolint config — Dockerfile linting for the api/ui/widget images.
# Run: bash scripts/hadolint.sh  (npm run security:hadolint)
#
# Any finding at or above the failure threshold fails the gate. Every ignored
# rule below carries its justification, the same way scripts/semgrep.sh
# annotates each --exclude-rule.

failure-threshold: warning

# Base images are already tagged (node:22-alpine, nginx:1.27-alpine), so DL3006
# ("always tag the version") and DL3007 ("do not use latest") are satisfied and
# are NOT ignored — a future untagged FROM will still turn this red.

# Hadolint has no native expiry field, so each ignored rule carries a `revisit:`
# date in its comment and a matching, owner-tracked entry in
# security/exceptions.yaml (the forcing function is `npm run security:exceptions`,
# which goes red once that date passes).

ignored:
  # DL3002 — "Last USER should not be root."
  # Fires on ui/Dockerfile and widget/Dockerfile: both are nginx images that
  # serve static assets on port 80, a privileged port that a non-root user
  # cannot bind. Running unprivileged requires the nginxinc/nginx-unprivileged
  # base (listens on 8080) plus matching nginx.conf changes, which are owned by
  # a separate workstream (the nginx configs are out of scope for this change).
  # api/Dockerfile already drops to `USER node`. Deferred for the two nginx
  # images; also expressed as Checkov CKV_DOCKER_3 in .checkov.yaml and Trivy
  # AVD-DS-0002 in .trivyignore so all three tools agree.
  # Catalogued as `hadolint-nginx-root`; revisit: 2027-02-16.
  - DL3002

  # DL3018 — "Pin versions in apk add."
  # ui/Dockerfile runs `apk add --no-cache brotli`. Alpine package versions are
  # tied to the base image's repo snapshot (nginx:1.27-alpine), not published as
  # independently stable pins, so a hard version pin breaks on the next base
  # bump for no security benefit — the pin would float or 404 rather than lock.
  # --no-cache already prevents a stale package index. Revisit if we move to a
  # pinned Alpine repository mirror.
  # Catalogued as `hadolint-apk-nopin`; revisit: 2027-02-16.
  - DL3018
