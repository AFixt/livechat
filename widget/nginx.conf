server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # ---------------------------------------------------------------------------
  # Security headers — customer widget (see docs/adr/0012-static-host-security-headers.md).
  #
  # widget.js is the cross-origin embed contract (requirements.md §6.2): client
  # sites load it from another origin, so Access-Control-Allow-Origin and
  # Cross-Origin-Resource-Policy stay "cross-origin" — the OPPOSITE of the
  # console, which is same-origin. The widget must also stay iframe/embeddable-
  # friendly, so there is NO X-Frame-Options and the CSP uses `frame-ancestors *`
  # rather than 'none'.
  #
  # The CSP governs the widget host's OWN documents (the standalone preview /
  # demo page). The embedded script runs in the host page's context, under the
  # host page's CSP — this policy cannot loosen that. It is 'self' plus the API
  # origin (HTTPS + WSS for Socket.IO); NO 'unsafe-eval'. 'unsafe-inline' is
  # present for style-src only because the widget injects its own styles into
  # its shadow root at runtime with no nonce available on a static host.
  #
  # nginx's add_header does NOT merge: a location block that sets ANY add_header
  # inherits NONE of these, so location = /widget.js repeats the full set. Keep
  # the lists in sync — scripts/check-headers.mjs fails the build if they drift.
  # ---------------------------------------------------------------------------
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors *; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.livechat.afixt.com wss://api.livechat.afixt.com" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types application/javascript application/json;
  gzip_min_length 512;

  # widget.js is the embed contract from requirements.md §6.2 — long cache;
  # version-bumping happens via a new filename or a query param in the client's
  # <script> tag.
  location = /widget.js {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors *; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.livechat.afixt.com wss://api.livechat.afixt.com" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
