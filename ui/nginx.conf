server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---------------------------------------------------------------------------
  # Security headers — support console (see docs/adr/0012-static-host-security-headers.md).
  #
  # The console is a self-contained Vite build. It only ever talks back to the
  # API origin (HTTPS + WSS for Socket.IO), so the CSP is locked to 'self' plus
  # that single origin. NO 'unsafe-eval'. 'unsafe-inline' is present for
  # style-src only: MUI/emotion inject <style> tags and inline `style=` at
  # runtime and there is no nonce plumbing through a static host. Scripts stay
  # strict ('self', no inline).
  #
  # The console must NOT be framable (clickjacking): frame-ancestors 'none' +
  # X-Frame-Options DENY. Cross-Origin-Resource-Policy is same-origin — unlike
  # the widget, no other site loads console assets.
  #
  # nginx's add_header does NOT merge: a location block that sets ANY add_header
  # inherits NONE of these, so every location below repeats the full set. Keep
  # the lists in sync — scripts/check-headers.mjs fails the build if they drift.
  # ---------------------------------------------------------------------------
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.livechat.afixt.com wss://api.livechat.afixt.com" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets: immutable, long cache.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.livechat.afixt.com wss://api.livechat.afixt.com" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri =404;
  }

  # HTML: never cache so app-platform deploys become visible immediately.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.livechat.afixt.com wss://api.livechat.afixt.com" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }
}
