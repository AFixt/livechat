name: Secret scan (suspected tier)

# PR-time safety net for the SUSPECTED secret tier (issue #82, ADR-0012).
#
# The VERIFIED/blocking tier already runs in ci.yml via `check:all` ->
# `security` -> `security:secrets`. This workflow adds the non-blocking
# suspected passes so unverified detector hits and baseline drift are surfaced
# on the PR for human review without failing the build. Deliberately NOT
# scheduled (per #50 and CLAUDE.md).
#
# continue-on-error keeps both steps advisory: they annotate, they never block.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suspected:
    name: Suspected secrets (warn only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the git-history scan

      - name: Install trufflehog
        run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        # Pinned to the version that generated .secrets.baseline so plugin
        # hashing matches and the drift check stays quiet on unchanged code.
        run: pip install detect-secrets==1.5.0

      - name: trufflehog — suspected (unverified/unknown) tier
        continue-on-error: true
        run: npm run security:secrets:suspected

      - name: detect-secrets — baseline drift
        continue-on-error: true
        run: npm run security:secrets:baseline
