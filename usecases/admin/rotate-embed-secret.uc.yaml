id: admin-rotate-embed-secret
title: "Super admin rotates a tenant's embed secret"
type: extension
description: |
  From the expanded tenant settings surface, activating "Rotate embed
  secret" invalidates the old customer-identity signing secret and shows the
  new one exactly once, in an alert the admin must copy immediately. The
  alert must be a real alert role so the one-time nature is announced.

start_location: "http://localhost:5174/admin/tenants"

preconditions:
  - A super_admin user is authenticated.
  - At least one tenant exists and its settings surface is expanded (see
    admin-edit-tenant-settings.uc.yaml).

data: {}

steps:
  - locate: heading "Rotate embed secret"
  - locate: button "Rotate embed secret"
  - focus: button "Rotate embed secret"
  - activate: button "Rotate embed secret"
  - verify: text "New embed secret (save this — it won't be shown again)"
