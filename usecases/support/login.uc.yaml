id: support-login
title: "Support staff signs in"
type: positive
description: |
  A staff user navigates to the support console, enters valid credentials, and
  lands on the dashboard. Exercised in Playwright against a real browser;
  requires the api + docker-compose stack to be running so the
  POST /auth/login round-trips successfully.

start_location: "http://localhost:5174/login"

expected_result: >-
  The staff user is authenticated and lands on the dashboard (url "/",
  heading "Dashboard").

preconditions:
  - A staff user exists in the database with the credentials below.

data:
  email: "staff@acme.example"
  password: "Staff!Password1"

# Both fields are MUI `required`, so their label text carries an aria-hidden
# asterisk that an exact `field "..."` match cannot see past. Email uses the
# role form; a password input has no role, so it matches by substring.
# See usecases/README.md, "Targeting required fields".
steps:
  - locate: heading "Sign in"
  - locate: textbox "Email address"
  - focus: textbox "Email address"
  - enter: textbox "Email address" value "{{ email }}"
  - locate: field contains "Password"
  - focus: field contains "Password"
  - enter: field contains "Password" value "{{ password }}"
  - locate: button "Sign in"
  - focus: button "Sign in"
  - activate: button "Sign in"
  - verify: url "http://localhost:5174/"
  - locate: heading "Dashboard"
