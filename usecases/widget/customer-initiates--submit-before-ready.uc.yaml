id: widget-customer-initiates--submit-before-ready
title: "Visitor submits the start-chat form before the session is ready"
extends: widget-customer-initiates
type: extension
description: |
  §5.1.3 / issue #129 — the widget renders the start-chat form immediately, but
  a visitor session only exists after several sequential API round-trips. A
  visitor on a slow link can fill in and submit the form before that finishes.

  Submitting early must still start a chat. It must not surface an error, and
  it must not discard what the visitor typed. While the widget waits, the form
  is marked busy and the wait is announced, so the submit button is never a
  silently dead control.

  A variant of widget-customer-initiates that takes the same path with no pause
  between filling the fields and submitting — the parent's `focus` step on the
  submit button is what usually gives the bootstrap time to land.

preconditions:
  - The API stack is running with an "acme" tenant.
  - At least one support agent is available, so the chat lands active.
  - The visitor has no existing session (a first visit, or an expired cookie).

data:
  visitor_name: "Quick Visitor"
  first_message: "I need help right away."

# Reuse the parent up to entering the first message, then submit immediately —
# no intervening focus step, so the submit races the widget's own startup.
steps_override:
  from_step: 9
  steps:
    - "note: submitted with no intervening step, so the write races the bootstrap"
    - 'activate: button "Start chat"'
    # Reaching the transcript is the assertion: a session failure leaves the
    # visitor on the form with a role="alert", never showing the message back.
    - 'verify: text "{{ first_message }}"'

expected_result: >-
  The chat starts and the visitor's first message appears in the transcript.
  No session error is shown, the typed name and message are never lost, and the
  form exposes its pending state while the session is being established.
